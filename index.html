<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKASHI XDM - Bot WhatsApp</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: #0b0f19; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 480px; background: #111827; border: 1px solid #1f2937; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        
        .banner { 
            width: 100%; 
            height: 180px; 
            background: linear-gradient(135deg, #1f2937 0%, #111827 100%), url('akashi.jpeg') center/cover no-repeat; 
            position: relative; 
            background-color: #1f2937; 
        }
        .banner::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 40%, #111827); }

        .content { padding: 25px; }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { font-size: 22px; font-weight: 700; color: #ef4444; margin-bottom: 3px; }
        .header p { font-size: 12px; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.5px; }

        .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .status-card { background: #1f2937; padding: 12px; border-radius: 8px; font-size: 11px; text-align: center; border: 1px solid #374151; color: #9ca3af; text-transform: uppercase; }
        .status-card span { display: block; font-weight: 700; margin-top: 4px; font-size: 13px; color: #fff; }
        .online { color: #22c55e !important; }
        .started-msg { color: #38bdf8 !important; font-size: 12px !important; }

        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 11px; font-weight: 600; color: #9ca3af; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        select, input { width: 100%; padding: 12px 16px; background: #1f2937; border: 1px solid #374151; border-radius: 8px; color: #fff; font-size: 15px; outline: none; transition: border-color 0.2s; }
        select:focus, input:focus { border-color: #ef4444; }
        
        .btn { width: 100%; padding: 14px; background: #ef4444; color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
        .btn:hover { background: #dc2626; }
        .btn:disabled { background: #4b5563; cursor: not-allowed; }
        
        .result-box { display: none; margin-top: 20px; background: #1f2937; border: 1px solid #374151; border-radius: 12px; padding: 20px; text-align: center; }
        .result-box h3 { font-size: 12px; color: #9ca3af; text-transform: uppercase; margin-bottom: 12px; letter-spacing: 0.5px; }
        .code-display { font-size: 24px; font-weight: 700; color: #22c55e; letter-spacing: 2px; background: #111827; padding: 12px; border-radius: 8px; border: 1px dashed #374151; margin-bottom: 15px; }
        .copy-btn { background: #374151; color: #fff; border: none; padding: 10px 16px; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.2s; width: 100%; margin-bottom: 15px; }
        .copy-btn:hover { background: #4b5563; }
        .instructions { text-align: left; font-size: 12px; color: #9ca3af; line-height: 1.5; }
        .instructions ol { padding-left: 18px; }
        .instructions li { margin-bottom: 4px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="banner"></div>

        <div class="content">
            <div class="header">
                <h1>AKASHI XDM</h1>
                <p>Bot WhatsApp Multi-Appareils</p>
            </div>

            <!-- Grille de statut correspondant à ton interface -->
            <div class="status-grid">
                <div class="status-card">Statut <span id="bot-status" class="started-msg">Prêt</span></div>
                <div class="status-card">Appairage <span id="pairing-status">-</span></div>
                <div class="status-card">Serveur <span class="online">● Online</span></div>
                <div class="status-card">Système <span class="online">● Operational</span></div>
            </div>

            <div id="form-container">
                <div class="form-group">
                    <label for="country">Pays</label>
                    <select id="country">
                        <!-- Rempli dynamiquement -->
                    </select>
                </div>

                <div class="form-group">
                    <label for="phone">Numéro WhatsApp</label>
                    <input type="tel" id="phone" placeholder="Ex: 698278163">
                </div>

                <button class="btn" id="submit-btn" onclick="requestPairingCode()">SE CONNECTER À WHATSAPP</button>
            </div>

            <div class="result-box" id="result-box">
                <h3>Votre code d'appairage</h3>
                <div class="code-display" id="pairing-code">----</div>
                <button class="copy-btn" onclick="copyCode()">📋 Copier le code</button>
                <div class="instructions">
                    <ol>
                        <li>Ouvrez WhatsApp sur votre téléphone.</li>
                        <li>Accédez à <strong>Paramètres</strong> > <strong>Appareils associés</strong>.</li>
                        <li>Appuyez sur <strong>Associer un appareil</strong> puis <strong>Lier avec un numéro</strong>.</li>
                    </ol>
                </div>
                <button class="btn" style="background:#374151; margin-top:15px;" onclick="resetForm()">Recommencer</button>
            </div>
        </div>
    </div>

    <script>
        const countries = [
            { name: "Afghanistan", code: "+93" }, { name: "Afrique du Sud", code: "+27" }, { name: "Albanie", code: "+355" },
            { name: "Algérie", code: "+213" }, { name: "Allemagne", code: "+49" }, { name: "Andorre", code: "+376" },
            { name: "Angola", code: "+244" }, { name: "Arabie Saoudite", code: "+966" }, { name: "Argentine", code: "+54" },
            { name: "Arménie", code: "+374" }, { name: "Australie", code: "+61" }, { name: "Autriche", code: "+43" },
            { name: "Belgique", code: "+32" }, { name: "Bénin", code: "+229" }, { name: "Brésil", code: "+55" },
            { name: "Cameroun", code: "+237" }, { name: "Canada", code: "+1" }, { name: "Chili", code: "+56" },
            { name: "Chine", code: "+86" }, { name: "Colombie", code: "+57" }, { name: "Congo", code: "+242" },
            { name: "Corée du Sud", code: "+82" }, { name: "Côte d'Ivoire", code: "+225" }, { name: "Espagne", code: "+34" },
            { name: "États-Unis", code: "+1" }, { name: "France", code: "+33" }, { name: "Gabon", code: "+241" },
            { name: "Italie", code: "+39" }, { name: "Japon", code: "+81" }, { name: "Madagascar", code: "+261" },
            { name: "Mali", code: "+223" }, { name: "Maroc", code: "+212" }, { name: "Maurice", code: "+230" },
            { name: "Mexique", code: "+52" }, { name: "Niger", code: "+227" }, { name: "Nigeria", code: "+234" },
            { name: "Royaume-Uni", code: "+44" }, { name: "Sénégal", code: "+221" }, { name: "Suisse", code: "+41" },
            { name: "Tchad", code: "+235" }, { name: "Togo", code: "+228" }, { name: "Tunisie", code: "+216" },
            { name: "Turquie", code: "+90" }, { name: "Vietnam", code: "+84" }
        ];

        window.onload = () => {
            const select = document.getElementById('country');
            countries.sort((a, b) => a.name.localeCompare(b.name));
            countries.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.code;
                opt.textContent = `${c.name} (${c.code})`;
                if(c.code === "+237") opt.selected = true;
                select.appendChild(opt);
            });
        };

        async function requestPairingCode() {
            const countryCode = document.getElementById('country').value.replace('+', '');
            const rawPhone = document.getElementById('phone').value.trim();
            const btn = document.getElementById('submit-btn');

            if (!rawPhone) {
                alert("Veuillez entrer votre numéro de téléphone !");
                return;
            }

            const fullPhone = countryCode + rawPhone.replace(/^0+/, '');
            
            btn.disabled = true;
            btn.textContent = "Génération en cours...";
            document.getElementById('bot-status').textContent = "Started ⏳";
            document.getElementById('pairing-status').textContent = "Génération...";

            try {
                const response = await fetch(`https://akashi-xmd.onrender.com/pair?phone=${fullPhone}`);
                const data = await response.json();

                if (response.ok && data.code) {
                    document.getElementById('bot-status').textContent = "Connecté / Actif";
                    document.getElementById('pairing-status').textContent = data.code;
                    document.getElementById('form-container').style.display = 'none';
                    document.getElementById('pairing-code').textContent = data.code;
                    document.getElementById('result-box').style.display = 'block';
                } else {
                    alert(data.error || "Erreur lors de la génération du code.");
                    document.getElementById('bot-status').textContent = "Erreur";
                    document.getElementById('pairing-status').textContent = "Échec";
                    btn.disabled = false;
                    btn.textContent = "SE CONNECTER À WHATSAPP";
                }
            } catch (err) {
                console.error(err);
                alert("Erreur de connexion avec le serveur Render. Vérifie que ton service Render est bien actif.");
                document.getElementById('bot-status').textContent = "Erreur Serveur";
                btn.disabled = false;
                btn.textContent = "SE CONNECTER À WHATSAPP";
            }
        }

        function copyCode() {
            const code = document.getElementById('pairing-code').textContent;
            navigator.clipboard.writeText(code);
            alert("Code copié dans le presse-papier !");
        }

        function resetForm() {
            document.getElementById('result-box').style.display = 'none';
            document.getElementById('form-container').style.display = 'block';
            document.getElementById('phone').value = '';
            document.getElementById('bot-status').textContent = "Prêt";
            document.getElementById('pairing-status').textContent = "-";
            const btn = document.getElementById('submit-btn');
            btn.disabled = false;
            btn.textContent = "SE CONNECTER À WHATSAPP";
        }
    </script>
</body>
</html>
