<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKASHI XDM - Tableau de Bord</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #0b0b0e;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            background-image: radial-gradient(circle at 50% 20%, #2a0808 0%, #0b0b0e 70%);
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 550px;
            background: rgba(20, 20, 25, 0.85);
            border: 1px solid rgba(255, 0, 0, 0.2);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(255, 0, 0, 0.15);
            text-align: center;
            backdrop-filter: blur(10px);
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            background: rgba(0, 255, 100, 0.1);
            border: 1px solid rgba(0, 255, 100, 0.3);
            color: #00ff64;
            padding: 6px 15px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 15px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #00ff64;
            border-radius: 50%;
            margin-right: 8px;
            box-shadow: 0 0 8px #00ff64;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
        .hero-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 12px;
            border: 1px solid rgba(255, 0, 0, 0.3);
            margin-bottom: 15px;
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            color: #ff3333;
            letter-spacing: 1px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        p {
            color: #a0a0a5;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            font-size: 12px;
            color: #ccc;
            margin-bottom: 5px;
            display: block;
        }
        input {
            width: 100%;
            padding: 12px;
            background: #15151a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: border 0.3s;
        }
        input:focus {
            border-color: #ff3333;
        }
        .btn {
            display: inline-block;
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #ff2222, #990000);
            color: white;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.4);
            margin-top: 5px;
        }
        .btn:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #ff4444, #bb0000);
