<script>
        async function genererCode() {
            const phone = document.getElementById('phone').value.trim();
            if(!phone) {
                alert("Veuillez entrer un numéro de téléphone valide !");
                return;
            }

            alert("Génération du code d'appairage en cours pour : " + phone);

            try {
                // URL mise à jour avec le nom de ton projet AKASHI XDM
                const renderUrl = "https://akashi-xdm.onrender.com/pair?phone=" + encodeURIComponent(phone);
                
                const response = await fetch(renderUrl);
                const data = await response.json();

                if(data.code) {
                    alert("Voici ton code d'appairage WhatsApp : " + data.code);
                } else {
                    alert("Code généré avec succès ! Vérifie les logs de ton bot sur Render.");
                }
            } catch (error) {
                console.error(error);
                alert("Erreur de connexion avec le serveur Render. Vérifie que ton bot tourne bien en arrière-plan.");
            }
        }
    </script>
